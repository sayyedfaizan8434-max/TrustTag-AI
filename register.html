<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TrustTag AI - Register</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eaf3ff,
                #dce8ff
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .container {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);

        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1463d8;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }

        button {

            width: 100%;

            padding: 13px;

            background: #1463d8;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #0d4fae;

        }

        .login {

            text-align: center;

            margin-top: 20px;

        }

        .login a {

            color: #1463d8;

            text-decoration: none;

            font-weight: bold;

        }

        #message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            🛡️ TrustTag AI
        </div>

        <div class="subtitle">
            Create your account
        </div>


        <form id="registerForm">

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>


        <div id="message"></div>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                try {

                    const response =
                        await fetch("/api/register", {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    if (data.success) {

                        message.style.color = "green";

                        message.textContent =
                            "Registration successful! Please login.";

                        setTimeout(() => {

                            window.location.href =
                                "login.html";

                        }, 1000);

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            data.message;

                    }

                }

                catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Server connection failed.";

                }

            }
        );

    </script>

</body>

</html>
