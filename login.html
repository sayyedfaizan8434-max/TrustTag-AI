<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TrustTag AI - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eaf3ff,
                #dce8ff
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);

        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1463d8;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }

        button {

            width: 100%;

            padding: 13px;

            background: #1463d8;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #0d4fae;

        }

        .register {

            text-align: center;

            margin-top: 20px;

        }

        .register a {

            color: #1463d8;

            text-decoration: none;

            font-weight: bold;

        }

        #message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            🛡️ TrustTag AI
        </div>

        <div class="subtitle">
            Login to verify products
        </div>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <div id="message"></div>


        <div class="register">

            New user?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const response =
                        await fetch("/api/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })

                        });


                    const data =
                        await response.json();


                    if (data.success) {

                        message.style.color = "green";

                        message.textContent =
                            "Login successful...";


                        setTimeout(() => {

                            window.location.href =
                                data.redirect;

                        }, 700);

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            data.message;

                    }

                }

                catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Server connection failed.";

                }

            }
        );

    </script>

</body>

</html>
